name: Deploy to Google Cloud Run

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-cloud-run.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE || 'safeinbox-api' }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY || 'safeinbox' }}

jobs:
  deploy:
    name: Build & Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Run Backend Integration Tests
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests -v

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --concurrency=80
            --cpu=1
            --memory=512Mi
            --timeout=30s
            --set-env-vars=ENVIRONMENT=production,FORCE_HTTPS=true
          secrets: |
            DATABASE_URL=SAFEINBOX_DATABASE_URL:latest

      - name: Verify Service Health
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed service URL: $SERVICE_URL"
          curl -f -s "$SERVICE_URL/health" || { echo "Health check failed!"; exit 1; }
          echo "Cloud Run deployment is healthy and responding."

