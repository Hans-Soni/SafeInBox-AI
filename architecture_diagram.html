<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeInbox AI - Complete System Architecture & Pipeline Diagram</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(26, 34, 53, 0.85);
      --card-border: #2e3b55;
      --accent-coral: #FFA586;
      --accent-crimson: #B51A2B;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      position: sticky;
      top: 15px;
      z-index: 100;
      background: rgba(11, 15, 25, 0.9);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    .btn {
      background: linear-gradient(135deg, #242F40, #10152F);
      color: var(--text-main);
      border: 1px solid var(--accent-coral);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--accent-coral);
      color: #10152F;
      box-shadow: 0 0 15px rgba(255, 165, 134, 0.4);
    }

    .diagram-container {
      background: radial-gradient(circle at 50% 20%, #151b2e 0%, #0b0f19 80%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 35px;
      max-width: 1300px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }
    h1 {
      font-size: 26px;
      letter-spacing: 1px;
      color: var(--accent-coral);
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 13px;
    }

    /* SVG Canvas */
    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    @media print {
      body { padding: 0; background: #fff; color: #000; }
      .toolbar { display: none; }
      .diagram-container { box-shadow: none; border: none; max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="btn" onclick="saveAsPdf()">📄 Save / Print as PDF</button>
    <button class="btn" onclick="downloadAsPng()">🖼️ Download Image (PNG)</button>
  </div>

  <script>
    function saveAsPdf() {
      window.print();
    }

    function downloadAsPng() {
      const svg = document.getElementById("architectureSvg");
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svg);

      const canvas = document.createElement("canvas");
      canvas.width = 2400; // 2x high resolution
      canvas.height = 1800;
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.fillStyle = "#0b0f19";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement("a");
        a.download = "safeinbox_ai_architecture_diagram.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    }
  </script>
